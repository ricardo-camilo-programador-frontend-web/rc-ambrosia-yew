[build]
target = "index.html"
dist = "dist"
public_url = "/"

[serve]
address = "0.0.0.0"
port = 8080

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "cp -r public/* dist/ 2>/dev/null || true"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "rm -rf /tmp/rc-ambrosia-yew/target/wasm-opt 2>/dev/null || true"]
