[build]
target = "index.html"
dist = "dist"
public_url = "/"
# NOTE: wasm-opt = false is a known bug in Trunk 0.21.14
# For production builds, use scripts/build-web.sh instead
# This Trunk.toml is for local dev only (trunk serve)

[serve]
addresses = ["0.0.0.0"]
port = 8080

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "cp -r public/* dist/ 2>/dev/null || true"]

[tools]
wasm-opt = false
