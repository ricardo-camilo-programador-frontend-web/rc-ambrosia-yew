[package]
name = "rc-ambrosia-yew"
version = "0.1.0"
edition = "2021"
description = "Ambrosia apple landing page — built with Yew + Rust + WASM"
license = "MIT"
repository = "https://github.com/ricardo-camilo-programador-frontend-web/rc-ambrosia-yew"

[dependencies]
yew = { version = "0.21", features = ["csr"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
