[package]
name = "rc-ambrosia-yew"
version = "0.2.0"
edition = "2021"
description = "Ambrosia — Food of the Gods | Interactive editorial article about the Ambrosia apple"
license = "MIT"
repository = "https://github.com/ricardo-camilo-programador-frontend-web/rc-ambrosia-yew"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2.92"
web-sys = { version = "0.3.69", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlSelectElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "DomRect",
    "ScrollToOptions",
    "CssStyleDeclaration",
    "Storage",
    "Navigator",
    "Performance",
    "MediaQueryList",
    "DomTokenList",
] }
js-sys = "0.3.69"
gloo = "0.11"
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
